version: "3.8"

services:
  cctv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_MAPTILER_API_KEY=${VITE_MAPTILER_API_KEY:-UZoRbGNmqJsmrvrfNZC3}
    container_name: web-cctv
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
